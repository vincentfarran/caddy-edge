name: Publish Caddy Edge Image

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # Weekly rebuild picks up base-image (alpine) security patches. Caddy core + both
    # plugins are pinned in Dockerfile.caddy, so the caddy binary itself is reproducible;
    # only the base layer can change. Downstream consumers pin by DIGEST, so a new weekly
    # digest is never adopted automatically — it is bumped deliberately.
    - cron: "17 3 * * 1"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/caddy-edge
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.caddy
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Show pushed digest
        # The immutable ref to pin downstream (e.g. compose/caddy@hk in infra-ops):
        #   ghcr.io/<owner>/caddy-edge@<digest>
        run: echo "digest=${{ steps.build.outputs.digest }}"
